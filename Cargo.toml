[workspace]
resolver = "3"
members = ["crates/heli-core", "crates/heli-tgproxy", "crates/heli-zapret", "crates/heli-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Helisy"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "fs"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
h2 = "0.4"
http = "1"
rand = "0.10"
aes = "0.9"
ctr = "0.10"
cipher = "0.5"
sha2 = "0.11"
hmac = "0.13"
subtle = "2"
windows-sys = "0.61"
winreg = "0.56"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1

# The proxy's per-byte work (AES-CTR twice per direction, WebSocket masking) is generic code that
# is compiled into heli-tgproxy, so an unoptimised debug build would cap downloads at a few MB/s.
[profile.dev.package.heli-tgproxy]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.rustls]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
